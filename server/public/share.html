<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#409eff" />
  <title>对话分享 - 智知</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --bg-bubble-user: #409eff;
      --bg-bubble-assistant: #ffffff;
      --text: #1f2329;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
    }
    html.dark {
      --bg: #17171a;
      --bg-bubble-user: #409eff;
      --bg-bubble-assistant: #26262b;
      --text: #e8e8ea;
      --text-secondary: #9aa0aa;
      --border: #333338;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .3s, color .3s;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    .brand { font-size: 16px; font-weight: 700; color: #409eff; }
    .title { font-size: 15px; color: var(--text-secondary); }
    .theme-btn {
      border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
      border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
    }
    .msg { display: flex; margin-bottom: 18px; }
    .msg.user { justify-content: flex-end; }
    .bubble {
      max-width: 78%; padding: 12px 16px; border-radius: 14px; line-height: 1.7;
      font-size: 14.5px; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: var(--bg-bubble-user); color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant .bubble {
      background: var(--bg-bubble-assistant); border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .center-box {
      max-width: 380px; margin: 80px auto; text-align: center;
      background: var(--bg-bubble-assistant); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px;
    }
    .center-box h2 { font-size: 18px; margin-bottom: 8px; }
    .center-box p { color: var(--text-secondary); font-size: 13px; margin-bottom: 18px; }
    .center-box input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; background: transparent; color: var(--text);
      margin-bottom: 12px;
    }
    .center-box button {
      width: 100%; padding: 10px; background: #409eff; color: #fff; border: none;
      border-radius: 8px; font-size: 14px; cursor: pointer;
    }
    .err { color: #f56c6c; font-size: 13px; margin-top: 10px; }
    .footer { text-align: center; color: var(--text-secondary); font-size: 12px; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">智知 · 对话分享</div>
        <div class="title" id="convTitle">加载中…</div>
      </div>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">深色</button>
    </div>
    <div id="content"><div class="center-box"><p>正在加载对话…</p></div></div>
    <div class="footer">由 智知 Agent 提供 · 只读分享</div>
  </div>
  <script>
    const token = location.pathname.replace(/^\/share\//, '');
    const contentEl = document.getElementById('content');
    const titleEl = document.getElementById('convTitle');

    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    document.getElementById('themeBtn').textContent =
      document.documentElement.classList.contains('dark') ? '浅色' : '深色';
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const dark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      document.getElementById('themeBtn').textContent = dark ? '浅色' : '深色';
    }

    function box(html) {
      contentEl.innerHTML = '<div class="center-box">' + html + '</div>';
    }

    function renderMessages(title, messages) {
      titleEl.textContent = title || '对话记录';
      if (!messages || messages.length === 0) {
        box('<h2>空对话</h2><p>该分享没有任何消息。</p>');
        return;
      }
      let html = '';
      for (const m of messages) {
        const role = m.role === 'user' ? 'user' : 'assistant';
        const who = m.role === 'user' ? '用户' : '智知';
        const text = (m.content || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        html += '<div class="msg ' + role + '"><div><div class="label">' + who +
                '</div><div class="bubble">' + text + '</div></div></div>';
      }
      contentEl.innerHTML = html;
    }

    function showPassword(needMsg) {
      box(
        '<h2>对话已加密</h2><p>' + (needMsg || '请输入访问密码') + '</p>' +
        '<input type="password" id="pwd" placeholder="请输入密码" />' +
        '<button onclick="submitPwd()">解锁</button>' +
        '<div class="err" id="err"></div>'
      );
      document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') submitPwd(); });
    }

    async function submitPwd() {
      const pwd = document.getElementById('pwd').value;
      try {
        const res = await fetch('/api/shares/' + encodeURIComponent(token) + '/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd }),
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('err').textContent = data.error || '密码错误';
          return;
        }
        renderMessages(data.title, data.messages);
      } catch (e) {
        document.getElementById('err').textContent = '网络错误';
      }
    }

    async function init() {
      try {
        const res = await fetch('/api/shares/' + encodeURIComponent(token));
        if (res.status === 410) {
          box('<h2>分享已过期</h2><p>该对话分享链接已失效。</p>');
          return;
        }
        if (res.status === 404) {
          box('<h2>分享不存在</h2><p>链接无效或已被撤销。</p>');
          return;
        }
        const meta = await res.json();
        titleEl.textContent = '对话记录';
        if (meta.hasPassword) { showPassword(); return; }
        const res2 = await fetch('/api/shares/' + encodeURIComponent(token) + '/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        const data = await res2.json();
        if (!res2.ok) { showPassword(data.error); return; }
        renderMessages(data.title, data.messages);
      } catch (e) {
        box('<h2>加载失败</h2><p>网络错误，请稍后重试。</p>');
      }
    }
    init();
  </script>
</body>
</html>
