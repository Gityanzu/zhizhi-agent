# ===== CI：质量门禁（与 Jenkinsfile 的 Quality Gate / Unit Tests 对齐） =====
#
# 触发：push 到 dev/main、以及指向 dev/main 的 PR。
# 硬门禁：server 单元测试（vitest run）、client 构建（vite build）。
# 软门禁：两端类型检查 —— 存量类型错误尚未清零（与 Jenkinsfile 策略一致），
#         用 continue-on-error 只暴露不阻断；清零后把这两步的 continue-on-error 去掉即可。
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  server:
    name: Server · 类型检查 + 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查（软门禁：存量错误清零后改为阻断）
        run: npx tsc --noEmit
        continue-on-error: true

      - name: 单元测试
        run: npm run test:run

  client:
    name: Client · 类型检查 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        # electron 的 postinstall 需要下载二进制；GitHub Actions 可直连，无需镜像

      - name: 类型检查（软门禁：存量错误清零后改为阻断）
        run: npm run type-check
        continue-on-error: true

      - name: 构建
        run: npm run build

      - name: API 用法检查（软门禁）
        run: npm run lint:api
        continue-on-error: true
