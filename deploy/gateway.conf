# ===== 统一入口网关：一个 80 端口按路径分发到各服务 =====
#
# 路由表：
#   /           -> zhizhi-client  （前端静态 + /api 反代，SSE 由 client 内部 nginx 处理）
#   /jenkins/   -> zhizhi-jenkins （Jenkins 以 --prefix=/jenkins 运行，子路径原生支持）
#
# 其余服务（postgres/redis）不对外暴露，只在内网供 server 访问。

# WebSocket 升级头映射（Jenkins 脚本终端/CLI 用）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
  listen 80;
  server_name _;

  # 与后端上传限制对齐（知识库文档/头像等）
  client_max_body_size 50m;

  # ---- Jenkins（子路径反代：Jenkins 需以 --prefix=/jenkins 启动） ----
  location /jenkins/ {
    # 不带 URI 的 proxy_pass：保持 /jenkins 前缀原样转发
    proxy_pass http://jenkins:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }

  # ---- 前端 + API（默认入口） ----
  location / {
    proxy_pass http://client:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}
